name: Sync upstream manifest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate manifest from upstream
        run: python3 scripts/sync_upstream.py

      - name: Commit if the version moved
        run: |
          if git diff --quiet; then
            echo "nothing to do"
            exit 0
          fi
          version=$(python3 -c "import json;print(json.load(open('zigbee2mqtt_2/config.json'))['version'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync upstream Zigbee2MQTT $version"
          git push
